name: Build APKs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apks-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: Messaging
  RELEASE_APK_DIR: app/build/outputs/apk/release
  DEBUG_APK_DIR: app/build/outputs/apk/debug
  JAVA_VERSION: '17'

jobs:
  build-apks:
    name: Build release and debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build release and debug APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Rename APKs
        id: apks
        run: |
          REF_NAME="${GITHUB_REF_NAME//\//-}"
          RELEASE_APK="${APP_NAME}-${REF_NAME}-release-unsigned.apk"
          DEBUG_APK="${APP_NAME}-${REF_NAME}-debug.apk"

          mv "${RELEASE_APK_DIR}"/*.apk "${RELEASE_APK_DIR}/${RELEASE_APK}"
          mv "${DEBUG_APK_DIR}"/*.apk "${DEBUG_APK_DIR}/${DEBUG_APK}"

          echo "release_apk_path=${RELEASE_APK_DIR}/${RELEASE_APK}" >> "$GITHUB_OUTPUT"
          echo "debug_apk_path=${DEBUG_APK_DIR}/${DEBUG_APK}" >> "$GITHUB_OUTPUT"

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-release-unsigned
          path: ${{ steps.apks.outputs.release_apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-debug
          path: ${{ steps.apks.outputs.debug_apk_path }}
          if-no-files-found: error
          retention-days: 14
