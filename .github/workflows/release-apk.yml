name: Build and publish unsigned release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-release-apk:
    name: Build unsigned release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/*.apk \
            "app/build/outputs/apk/release/Messaging-${GITHUB_REF_NAME}-unsigned.apk"

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: messaging-release-apk-${{ github.ref_name }}-unsigned
          path: app/build/outputs/apk/release/Messaging-${{ github.ref_name }}-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "app/build/outputs/apk/release/Messaging-${GITHUB_REF_NAME}-unsigned.apk" \
            --title "Messaging ${GITHUB_REF_NAME} unsigned" \
            --generate-notes
